<div *ngIf="loading$ | async" class="spinner-container">
  <ng-container *ngIf="customLoadingIndicator; else defaultSpinner">
    <ng-container *ngTemplateOutlet="customLoadingIndicator"></ng-container>
  </ng-container>
  <ng-template #defaultSpinner>
    <div class="spinner-content">
      <mat-spinner
        class="custom-spinner"
        mode="indeterminate"
        color="accent"
      ></mat-spinner>
      <div *ngIf="progress$ | async as progress" class="loading-progress">
        {{ progress }}%
      </div>
    </div>
  </ng-template>
</div>
